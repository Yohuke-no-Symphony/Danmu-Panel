syntax = "proto3";

option csharp_namespace = "Yohuke.DanmuPanel.Apis.Protocols.Bilibili";

import "gift_item.proto";
import "user_info.proto";

// Field numbers verified against:
// https://github.com/Akegarasu/blivedm-go/blob/957b543d2bfa8c2ac8a7af2fb42ae73eb92443b2/pb/events.proto
message GiftBroadcast {
  uint64 uid = 1;
  string uname = 2;
  repeated GiftItem gift_list = 10;
  UserInfo sender_uinfo = 15;
}
